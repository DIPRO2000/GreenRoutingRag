# GreenRouting Configuration

app:
  name: "EcoWave"
  version: "1.0.0"
  description: "An Energy-Aware RAG Framework with Adaptive Model Routing and Quality-Aware Caching"
  data_dir: "data"
  db_path: "data/greenrouting.db"
  faiss_index_dir: "data/faiss_index"

models:
  ollama_base_url: "http://localhost:11434"
  # Default lightweight model for low complexity queries
  lightweight_model: "qwen2.5:0.5b"
  # Capable model for complex queries or retry fallback
  capable_model: "llama3.2:3b"
  # Embedding model
  embedding_model: "all-MiniLM-L6-v2"
  # Simulation fallback when Ollama is offline
  enable_simulation_fallback: true
  force_simulation_mode: false

rag:
  chunk_size: 500
  chunk_overlap: 50
  top_k_retrieval: 3
  similarity_metric: "cosine"

routing:
  complexity_threshold: 0.50
  # Factors for complexity calculation
  weights:
    length: 0.20
    reasoning_keywords: 0.35
    syntactic_complexity: 0.25
    domain_depth: 0.20
  # Retry policy if lightweight answer has low quality
  enable_retry_on_low_quality: true
  min_acceptable_quality_score: 0.55

caching:
  enabled: true
  # Similarity threshold for semantic cache hit
  semantic_similarity_threshold: 0.88
  # Quality-aware validation options
  enforce_document_context_match: true
  min_cache_grounding_score: 0.60
  max_cache_age_hours: 72

energy:
  measurement_mode: "modeled_tdp_estimate" # MVP measurement mode
  tracking_mode: "modeled" # "modeled", "codecarbon", or "auto"
  country_iso_code: "IND"
  offline_mode: true
  # Grid carbon intensity in g CO2e / kWh (India average ~708 g CO2e/kWh = 0.708 kg CO2e/kWh)
  grid_carbon_intensity_g_per_kwh: 708.0
  emission_factor_kg_per_kwh: 0.708

  # Hardware Power Assumptions (Watts)
  hardware:
    cpu_tdp_watts: 45.0
    gpu_tdp_watts: 75.0
    idle_overhead_watts: 5.0

  # Stage-specific Power Allocations (Watts)
  stage_power:
    query_processing_watts: 10.0      # Input token parsing & prompt assembly
    cache_lookup_watts: 12.0          # In-memory vector similarity & cache validation
    retrieval_embedding_watts: 25.0   # Text embedding model & FAISS search
    routing_analysis_watts: 15.0      # Complexity score heuristics

  # Model Inference Power Assumptions (Watts)
  model_power:
    lightweight_model_watts: 27.0     # e.g., Qwen 2.5 0.5B (~60% CPU TDP allocation)
    capable_model_watts: 93.75        # e.g., Llama 3.2 3B (CPU + 65% GPU TDP allocation)
    default_model_watts: 45.0         # General CPU TDP baseline fallback

baseline:
  mode: "STANDARD_RAG"               # Non-optimized baseline execution path
  model: "llama3.2:3b"               # Default capable model
  enable_cache: false                # Non-optimized baseline does not cache
  top_k_retrieval: 3
