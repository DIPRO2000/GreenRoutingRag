services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /home/app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - greenrouting-data:/app/data
      - huggingface-cache:/home/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  greenrouting-data:
  huggingface-cache:
  redis-data:
