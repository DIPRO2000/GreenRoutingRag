services:
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      HF_HOME: /home/app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - greenrouting-data:/app/data
      - huggingface-cache:/home/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  greenrouting-data:
  huggingface-cache:
